<style>
:root{
  --red:#E30613; --red-2:#EE4E55; --red-soft:#FDECEC; --ink:#0B0B0C; --ink-2:#2A2A2E; --mut:#6B6B73;
  --line:#E6E3DD; --bg:#F7F6F2; --card:#FFFFFF; --ok:#0E7C4A;
  --r:16px; --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
  --fh:'Montserrat',system-ui,sans-serif; --fb:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--fb);-webkit-font-smoothing:antialiased}
img,svg{max-width:100%;display:block}
a{color:var(--red)}
h1,h2,h3,h4{font-family:var(--fh);line-height:1.15;margin:0 0 .5em;letter-spacing:-.01em}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}

/* ---------- header ---------- */
.top{background:var(--ink);color:#fff;position:sticky;top:0;z-index:30}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:62px}
.top img.logo{height:34px;width:auto}
.top .lead{margin-left:auto;font:600 12px/1.2 var(--fh);letter-spacing:.08em;text-transform:uppercase;color:#bbb;text-align:right}
.top .lead b{display:block;color:#fff;font-size:13px;letter-spacing:.02em;text-transform:none}
.prog{height:4px;background:#26262a}
.prog i{display:block;height:100%;width:0;background:var(--red);transition:width .35s}

/* ---------- stepper ---------- */
.steps{display:flex;gap:6px;flex-wrap:wrap;padding:18px 0 4px}
.steps button{border:0;background:#E9E6E0;color:var(--mut);font:700 11px/1 var(--fh);height:28px;min-width:28px;padding:0 9px;border-radius:99px;cursor:pointer}
.steps button.on{background:var(--ink);color:#fff}
.steps button.done{background:var(--red-soft);color:var(--red)}
.step{display:none;padding:22px 0 40px;animation:fade .3s ease}
.step.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.kicker{font:700 12px/1 var(--fh);letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:10px;display:flex;align-items:center;gap:10px}
.kicker span{background:var(--red);color:#fff;border-radius:6px;padding:4px 7px;letter-spacing:.04em}
.step h2{font-size:clamp(26px,4.4vw,36px);font-weight:800}
.lede{color:var(--ink-2);font-size:17px;max-width:62ch}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center;margin-top:8px}
.hero h1{font-size:clamp(32px,6vw,52px);font-weight:800}
.hero h1 em{font-style:normal;color:var(--red)}
.pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 12px;font:600 13px var(--fh);margin:0 6px 8px 0}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--red)}
@media (max-width:720px){.hero{grid-template-columns:1fr}.hero .art{order:-1;max-width:380px}}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);margin:18px 0}
.card h3{font-size:19px}
.note{background:var(--red-soft);border:1px solid #F7C9CB;border-radius:12px;padding:14px 16px;font-size:14.5px;color:#5c1418;margin:14px 0}
.note.gray{background:#F1EFEA;border-color:var(--line);color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
.stat b{display:block;font:800 26px/1.1 var(--fh);color:var(--red)}
.stat span{font-size:14px;color:var(--ink-2)}
.stat small{display:block;color:var(--mut);font-size:12px;margin-top:6px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;vertical-align:top}
table.t th{font:700 12px var(--fh);text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.src{font-size:12px;color:var(--mut);margin-top:8px}
.tag{display:inline-block;font:700 11px/1 var(--fh);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:6px;background:#111;color:#fff;margin-right:6px}
.tag.r{background:var(--red)}
.tag.g{background:#E9E6E0;color:var(--ink)}

/* ---------- planes ejemplo ---------- */
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:10px}
@media (max-width:720px){.plans{grid-template-columns:1fr}}
.plan{border:1.5px solid var(--line);border-radius:16px;padding:18px;background:#fff;position:relative}
.plan.feat{border-color:var(--red);box-shadow:0 10px 30px rgba(227,6,19,.12)}
.plan .badge{position:absolute;top:-11px;left:16px;background:var(--red);color:#fff;font:700 11px/1 var(--fh);padding:5px 8px;border-radius:6px;letter-spacing:.06em;text-transform:uppercase}
.plan h4{font-size:17px;margin:4px 0 2px}
.plan .price{font:800 28px/1 var(--fh)}
.plan .price small{font-size:13px;font-weight:600;color:var(--mut)}
.plan ul{padding-left:18px;margin:12px 0 0;font-size:14px}
.plan li{margin:4px 0}
.plan .per{font-size:13px;color:var(--ok);font-weight:600;margin-top:8px}

/* ---------- form fields ---------- */
.q{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin:16px 0;box-shadow:var(--shadow)}
.q > label.l,.q > .l{display:block;font:700 16px/1.35 var(--fh);margin-bottom:4px}
.q .help{color:var(--mut);font-size:14px;margin:0 0 12px}
.q .req{color:var(--red)}
input[type=text],input[type=tel],textarea{width:100%;font:16px var(--fb);color:var(--ink);background:#FBFAF8;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;transition:border .2s,background .2s}
textarea{min-height:96px;resize:vertical}
input[type=text]:focus,input[type=tel]:focus,textarea:focus{border-color:var(--ink);background:#fff}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.opts.one{grid-template-columns:1fr}
.opt{position:relative;display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;background:#FBFAF8;transition:border .15s,background .15s;font-size:15px}
.opt:hover{border-color:#bdb9b0}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .box{flex:0 0 20px;height:20px;border:2px solid #b9b5ac;border-radius:6px;margin-top:1px;display:grid;place-items:center;background:#fff}
.opt input[type=radio] + .box{border-radius:50%}
.opt.sel{border-color:var(--ink);background:#fff}
.opt.sel .box{background:var(--red);border-color:var(--red)}
.opt.sel .box::after{content:"";width:8px;height:8px;border-radius:2px;background:#fff}
.opt input[type=radio] + .box::after{border-radius:50%!important}
.opt.dis{opacity:.45;cursor:not-allowed}
.opt .txt b{display:block;font-family:var(--fh);font-size:15px}
.opt .txt small{display:block;color:var(--mut);font-size:13px;margin-top:3px;line-height:1.4}
.other{margin-top:10px;display:none}
.other.on{display:block}
.counter{font:600 12px var(--fh);color:var(--mut);margin-top:8px}
/* cards grandes (marca) */
.bigopts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (max-width:720px){.bigopts{grid-template-columns:1fr}}
.bigopts .opt{flex-direction:column;padding:16px}
.bigopts .opt .box{position:absolute;top:14px;right:14px}
.bigopts .opt .txt b{font-size:17px;padding-right:28px}
.bigopts .pros{font-size:13px;margin-top:8px;color:var(--ink-2)}
.bigopts .pros span{display:block}
/* escala */
.scale{display:grid;grid-template-columns:110px 1fr 110px;gap:10px;align-items:center;margin:10px 0}
.scale .end{font:600 13px var(--fh);color:var(--ink-2)}
.scale .end.r{text-align:right}
.scale .dots{display:flex;justify-content:space-between;gap:6px}
.scale .dots label{flex:1;cursor:pointer}
.scale .dots input{position:absolute;opacity:0}
.scale .dots span{display:block;height:38px;border-radius:10px;border:1.5px solid var(--line);background:#FBFAF8;display:grid;place-items:center;font:700 13px var(--fh);color:var(--mut)}
.scale .dots input:checked + span{background:var(--ink);border-color:var(--ink);color:#fff}
@media (max-width:560px){.scale{grid-template-columns:1fr 1fr}.scale .dots{grid-column:1/-1;order:3}.scale .end.r{text-align:right}}
/* paletas */
.sw{display:flex;height:54px;border-radius:10px;overflow:hidden;margin-bottom:10px;border:1px solid rgba(0,0,0,.08);width:100%}
.sw i{flex:1}
.pan{font-size:11.5px;color:var(--mut);line-height:1.45}
/* tipografias */
.fprev{font-size:30px;line-height:1.05;margin-bottom:6px;color:var(--ink)}
/* logos */
.lprev{height:74px;display:grid;place-items:center;background:#F3F1EC;border-radius:10px;margin-bottom:10px;width:100%}
.lprev svg{height:56px;width:auto}
/* referencias */
.ref{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:#fff}
.ref h4{font-size:15px;margin:0 0 4px}
.ref p{font-size:13.5px;margin:4px 0 0;color:var(--ink-2)}
.ref .city{font:700 11px var(--fh);letter-spacing:.08em;text-transform:uppercase;color:var(--red)}

/* ---------- nav ---------- */
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.btn{appearance:none;border:0;cursor:pointer;font:700 15px var(--fh);border-radius:12px;padding:14px 20px;display:inline-flex;align-items:center;gap:10px;text-decoration:none;transition:transform .1s,box-shadow .2s}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--red);color:#fff;box-shadow:0 8px 20px rgba(227,6,19,.25)}
.btn.dark{background:var(--ink);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.wa{background:#1FA855;color:#fff;box-shadow:0 8px 20px rgba(31,168,85,.25);font-size:16px;padding:16px 22px}
.btn svg{width:20px;height:20px}
.save{font-size:12.5px;color:var(--mut)}
.err{color:var(--red);font-weight:600;font-size:14px;margin-top:10px;display:none}
.err.on{display:block}

/* ---------- footer ---------- */
footer{background:var(--ink);color:#bbb;padding:34px 0;margin-top:30px;font-size:13.5px}
footer .wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
footer img{height:30px;width:auto}
footer a{color:#fff}

/* ---------- reporte ---------- */
#report{display:none;padding:26px 0 50px}
body.rep #app{display:none}
body.rep #report{display:block}
.rhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;border-bottom:3px solid var(--ink);padding-bottom:16px;margin-bottom:10px}
.rhead img{height:44px;width:auto}
.rhead h1{font-size:28px;margin:12px 0 4px}
.rmeta{font-size:13.5px;color:var(--mut)}
.rtools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.rsec{margin:22px 0 8px;break-inside:avoid-page}
.rsec h2{font-size:18px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:8px}
.rsec h2 span{background:var(--red);color:#fff;font-size:12px;border-radius:6px;padding:4px 7px}
.ritem{display:grid;grid-template-columns:240px 1fr;gap:14px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14.5px;break-inside:avoid}
.ritem .k{font-weight:600;color:var(--ink-2)}
.ritem .v.empty{color:#aaa;font-style:italic}
.chip{display:inline-block;background:#F1EFEA;border-radius:6px;padding:3px 8px;margin:2px 4px 2px 0;font-size:13.5px}
.bar{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut)}
.bar .b{display:flex;gap:3px}
.bar .b i{width:18px;height:10px;border-radius:3px;background:#E6E3DD}
.bar .b i.on{background:var(--red)}
@media (max-width:640px){.ritem{grid-template-columns:1fr;gap:2px}}

@media print{
  @page{size:Letter;margin:14mm}
  body{background:#fff;font-size:12px}
  .top,.rtools,footer,.noprint{display:none!important}
  #report{padding:0}
  .ritem{font-size:12px;padding:6px 0}
  .chip{background:#eee}
  a{color:inherit;text-decoration:none}
}
</style>
</head>
<body>

function fieldHTML(f){

function collect(){
  const A = {};
  for (const f of ALLF){
    if (['text','tel','textarea'].includes(f.t)){
      const v = form.elements[f.id]?.value.trim(); if (v) A[f.id] = v;
    } else {
      const els = [...form.querySelectorAll(`input[name="${f.id}"]`)].filter(e=>e.checked);
      let vals = els.map(e => e.value==='__other' ? ('Otro: ' + (form.elements[f.id+'__otro']?.value.trim()||'')) : e.value);
      if (!vals.length) continue;
      if (f.t==='scale') A[f.id] = Number(vals[0]);
      else if (f.t==='check') A[f.id] = vals;
      else A[f.id] = vals[0];
    }
  }
  return A;
}

function fill(A){
  for (const f of ALLF){
    const v = A[f.id]; if (v==null) continue;
    if (['text','tel','textarea'].includes(f.t)){ if (form.elements[f.id]) form.elements[f.id].value = v; continue; }
    const arr = Array.isArray(v) ? v : [String(v)];
    const inputs = [...form.querySelectorAll(`input[name="${f.id}"]`)];
    for (const val of arr){
      if (String(val).startsWith('Otro: ')){
        const o = inputs.find(i=>i.value==='__other'); if (o){ o.checked = true; form.elements[f.id+'__otro'].value = val.slice(6); }
      } else {
        const i = inputs.find(i=>i.value===String(val)); if (i) i.checked = true;
      }
    }
  }
  refreshUI();
}

function refreshUI(){
  form.querySelectorAll('.opt').forEach(l=>{ const i=l.querySelector('input'); l.classList.toggle('sel', !!i?.checked); });
  form.querySelectorAll('.q').forEach(q=>{
    const oth = q.querySelector('input[value="__other"]'); const box = q.querySelector('.other');
    if (oth && box) box.classList.toggle('on', oth.checked);
  });
  for (const f of ALLF.filter(f=>f.max)){
    const inputs=[...form.querySelectorAll(`input[name="${f.id}"]`)]; const n=inputs.filter(i=>i.checked).length;
    inputs.forEach(i=>{ const dis = !i.checked && n>=f.max; i.disabled = dis; i.closest('.opt').classList.toggle('dis', dis); });
    const c=form.querySelector(`[data-counter="${f.id}"]`); if(c) c.textContent = `${n} de ${f.max}`;
  }
  const A = collect();
  const total = ALLF.length, done = ALLF.filter(f=>A[f.id]!=null).length;
  document.getElementById('progbar').style.width = Math.round(done/total*100)+'%';
  document.querySelectorAll('#steps button').forEach((b,i)=>{
    const fs = S[i].fields||[]; const ok = fs.length && fs.some(f=>A[f.id]!=null);
    b.classList.toggle('done', !!ok && i!==cur); b.classList.toggle('on', i===cur);
  });
}

const b64u = u8 => { let s=''; for (let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
const unb64u = s => { s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; const b=atob(s); return Uint8Array.from(b, c=>c.charCodeAt(0)); };
async function pack(obj){
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  if ('CompressionStream' in window){
    try{
      const st = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
      return 'z' + b64u(new Uint8Array(await new Response(st).arrayBuffer()));
    }catch(e){}
  }
  return 'u' + b64u(bytes);
}
async function unpack(s){
  const kind = s[0], data = unb64u(s.slice(1));
  if (kind==='z'){
    const st = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return JSON.parse(await new Response(st).text());
  }
  return JSON.parse(new TextDecoder().decode(data));
}
const baseURL = () => location.href.split('#')[0].split('?')[0];

function fmt(f, v){
  if (v==null) return '';
  if (f.t==='scale') return `${v}/5 (${f.a} ← → ${f.b})`;
  return Array.isArray(v) ? v.join(', ') : String(v);
}
function plainText(A){
  const out = [`BRIEF NFOKU · ${LEAD.toUpperCase()}`, `Fecha: ${new Date(A._t||Date.now()).toLocaleString('es-MX')}`, ''];
  for (const s of S){
    if (!s.fields) continue;
    out.push(`== ${s.num} ${s.title.toUpperCase()} ==`);
    for (const f of s.fields){ if (A[f.id]!=null) out.push(`• ${f.l || ('Personalidad: '+f.a+' / '+f.b)}: ${fmt(f,A[f.id])}`); }
    out.push('');
  }
  return out.join('\n');
}
function waSummary(A, link){
  const g = id => { const f = ALLF.find(x=>x.id===id); return A[id]!=null ? fmt(f, A[id]) : '—'; };
  return [
    `*Brief NFOKU completado* ✅`,

    ``,

  ].join('\n');
}

async function buildLink(A){ return baseURL() + '#r=' + await pack(A); }

function validate(A){
  const missing = ALLF.filter(f=>f.req && A[f.id]==null);
  const err = document.getElementById('err');
  if (missing.length){
    err.textContent = 'Falta: ' + missing.map(f=>f.l).join(' · ');
    err.classList.add('on');
    const s = S.findIndex(x=>x.id===missing[0].sec.id);
    if (s !== cur){ setTimeout(()=>go(s), 900); }
    return false;
  }
  err.classList.remove('on'); return true;
}

      <button class="btn ghost" id="rCopy">Copiar como texto</button>
      ${local?`<button class="btn ghost" id="rBack">← Volver a editar</button>`:`<a class="btn ghost" href="${baseURL()}">Abrir brief vacío</a>`}
    </div>`;
  for (const s of S){
    if (!s.fields) continue;
    h += `<div class="rsec"><h2><span>${s.num}</span>${esc(s.title)}</h2>`;
    for (const f of s.fields){
      const k = f.l || 'Personalidad';
      h += `<div class="ritem"><div class="k">${esc(k)}</div><div class="v">${valHTML(f, A[f.id])}</div></div>`;
    }
    h += `</div>`;
  }
  h += `<p class="src" style="margin-top:24px">Documento generado por el brief interactivo de NFOKU · ${esc(baseURL())}</p>`;
  R.innerHTML = h;
  document.body.classList.add('rep');
  window.scrollTo(0,0);
  document.getElementById('rCopy').onclick = async ev => { try{ await navigator.clipboard.writeText(plainText(A)); ev.target.textContent='¡Copiado!'; }catch(e){} };
  const back = document.getElementById('rBack'); if (back) back.onclick = ()=>{ document.body.classList.remove('rep'); go(cur); };
}

   ARRANQUE
   =================================================================== */
(async function init(){
  const hash = location.hash;
  if (hash.startsWith('#r=')){
    try { const A = await unpack(hash.slice(3)); showReport(A, false); document.title = 'Respuestas · Brief NFOKU · ' + (A.nombre||LEAD); return; }
    catch(e){ alert('No se pudieron leer las respuestas de este enlace. Puede estar incompleto: copia el enlace completo desde WhatsApp.'); }
  }
  try { const saved = JSON.parse(localStorage.getItem(STORE_KEY)||'null'); if (saved) fill(saved); } catch(e){}
  const idx = S.findIndex(s=>'#'+s.id===hash);
  go(idx>=0 ? idx : 0);
})();
</script>
